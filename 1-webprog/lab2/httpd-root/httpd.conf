User www
Group www

ServerName helios.cs.ifmo.ru:28474

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/home/studs/s504879/httpd-root/public"
<Directory "/home/studs/s504879/httpd-root/public">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "/home/studs/s504879/httpd-root/error.log"
PidFile "/home/studs/s504879/httpd-root/httpd.pid"

LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    CustomLog "/home/studs/s504879/httpd-root/access.log" combined
</IfModule>

<IfModule mime_module>
    TypesConfig etc/apache24/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

<IfModule ssl_module>
SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
</IfModule>

FastCgiIpcDir /home/studs/s504879/httpd-root/fcgi-dynamic

FastCgiExternalServer "/home/studs/s504879/httpd-root/fcgi-bin/app.jar" -host localhost:28473 -nph
Alias /fcgi-bin/ "/home/studs/s504879/httpd-root/fcgi-bin/"
<Directory "/home/studs/s504879/httpd-root/fcgi-bin">
     AllowOverride None
     Options None
     Require all granted
</Directory>